# llama-server runs natively on the host (127.0.0.1:8080, started with --metrics).
# Host networking lets Prometheus scrape it without rebinding llama-server.
services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - /:/host:ro,rslave

  # No NVIDIA container toolkit needed: the host's nvidia-smi, NVML library and
  # device nodes are mounted in directly (driver 615.x, Arch).
  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.3.1
    container_name: nvidia-gpu-exporter
    restart: unless-stopped
    network_mode: host
    command:
      - --web.listen-address=127.0.0.1:9835
    devices:
      - /dev/nvidia0
      - /dev/nvidiactl
      - /dev/nvidia-uvm
    volumes:
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      - /usr/lib/libnvidia-ml.so.1:/usr/lib/libnvidia-ml.so.1:ro

  # Turns llama-server's /slots and /props (plus launch flags from /proc) into
  # metrics: per-slot state, context in use, llamacpp_config_info.
  slots-exporter:
    image: python:3.13-slim
    container_name: slots-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command: ["python", "-u", "/app/exporter.py"]
    volumes:
      - ./slots-exporter/exporter.py:/app/exporter.py:ro

volumes:
  prometheus-data:
  grafana-data:
