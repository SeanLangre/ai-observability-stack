global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: llama-server
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8080"]
        labels:
          instance: llama-local

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          instance: llama-host

  - job_name: nvidia-gpu
    static_configs:
      - targets: ["127.0.0.1:9835"]
        labels:
          instance: llama-host
